[project]
name = "kb-ingestion"
version = "0.1.0"
description = "EDGAR ingestion service (fetch → parse → chunk → embed)"
requires-python = ">=3.12"
dependencies = [
    "kb-domain",
    "kb-application-ports",
    "httpx>=0.27",
    "dagster>=1.9",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "minio>=7.2",
    "opensearch-py>=2.7",
]

[project.scripts]
kb-ingest = "kb_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_ingestion"]

[tool.uv.sources]
kb-domain = { workspace = true }
kb-application-ports = { workspace = true }
