[project]
name = "kb-query"
version = "0.1.0"
description = "Hybrid RAG query service"
requires-python = ">=3.12"
dependencies = [
    "kb-domain",
    "kb-ingestion",
    "httpx>=0.27",
    "openai>=1.0",
    "langgraph>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_query"]

[tool.uv.sources]
kb-domain = { workspace = true }
kb-ingestion = { workspace = true }
