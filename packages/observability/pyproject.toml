[project]
name = "kb-observability"
version = "0.1.0"
description = "Tracing, LLM observation hooks, and offline eval helpers"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_observability"]
