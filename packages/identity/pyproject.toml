[project]
name = "kb-identity"
version = "0.1.0"
description = "AuthN/Z principals, RBAC, and token validation ports"
requires-python = ">=3.12"
dependencies = [
    "pyjwt>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_identity"]
