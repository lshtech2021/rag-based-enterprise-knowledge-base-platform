[project]
name = "kb-testing"
version = "0.1.0"
description = "Test factories and fakes for knowledge-base domain"
requires-python = ">=3.12"
dependencies = [
    "kb-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_testing"]

[tool.uv.sources]
kb-domain = { workspace = true }
