[project]
name = "kb-bff"
version = "0.1.0"
description = "API gateway / BFF (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "kb-query",
    "kb-ingestion",
    "kb-identity",
    "kb-report",
    "kb-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_bff"]

[tool.uv.sources]
kb-query = { workspace = true }
kb-ingestion = { workspace = true }
kb-identity = { workspace = true }
kb-report = { workspace = true }
kb-observability = { workspace = true }
