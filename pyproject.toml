[project]
name = "rag-knowledge-base-platform"
version = "0.1.0"
description = "RAG-based enterprise knowledge base platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kb-domain",
    "kb-application-ports",
    "kb-testing",
    "kb-identity",
    "kb-bff",
    "kb-ingestion",
    "kb-query",
    "kb-report",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/domain",
    "packages/application_ports",
    "packages/testing",
    "packages/identity",
    "apps/bff",
    "services/ingestion",
    "services/query",
    "services/report",
]

[tool.uv.sources]
kb-domain = { workspace = true }
kb-application-ports = { workspace = true }
kb-testing = { workspace = true }
kb-identity = { workspace = true }
kb-bff = { workspace = true }
kb-ingestion = { workspace = true }
kb-query = { workspace = true }
kb-report = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "packages/domain",
    "packages/application_ports",
    "packages/testing",
    "packages/identity",
    "apps/bff",
    "services/ingestion",
    "services/query",
    "services/report",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "apps", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = [
    "kb_domain",
    "kb_application_ports",
    "kb_testing",
    "kb_identity",
    "kb_bff",
    "kb_ingestion",
    "kb_query",
    "kb_report",
]
mypy_path = [
    "packages/domain/src",
    "packages/application_ports/src",
    "packages/testing/src",
    "packages/identity/src",
    "apps/bff/src",
    "services/ingestion/src",
    "services/query/src",
    "services/report/src",
]

[[tool.mypy.overrides]]
module = "kb_ingestion.presentation.*"
disallow_untyped_decorators = false
disable_error_code = ["no-untyped-def"]
